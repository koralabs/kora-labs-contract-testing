name: PR Typecheck
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-tests:
    name: Typecheck harness
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: yarn install --frozen-lockfile
    - run: npx tsc --noEmit
