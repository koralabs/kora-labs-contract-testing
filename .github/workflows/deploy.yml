name: kora-labs-contract-testing
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Reviewed exact maintenance commit SHA
        required: true
        type: string
  push:
    branches:
      - master
    paths-ignore:
      - .github/workflows/deploy.yml
      - .github/workflows/release-tooling-tests.yml
      - scripts/release-receipt.cjs
      - test/release-receipt.test.cjs
jobs:
  deploy:
    # Dispatch on the reviewed maintenance ref uses its package-local workflow, never master's graph.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/maintenance/harness-0.0.7-20261021'
    name: Deploying from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v1

    - name: Publish ${{ github.workflow }}
      id: publish
      env:
        DEPLOYMENT_ACCESS_TOKEN: ${{ secrets.DEPLOYMENT_ACCESS_TOKEN }}
        SECRETS_CONTEXT: ${{ toJson(secrets) }}
        VARS_CONTEXT: ${{ toJson(vars) }}
        GITHUB_CONTEXT: ${{ toJson(github) }}
        DEPLOYMENT_TYPE: npm-publish
        NODE_VERSION: 20
        IS_PUBLIC: true
      run: |
        set -eu
        curl -H "Authorization: Bearer ${DEPLOYMENT_ACCESS_TOKEN}" https://raw.githubusercontent.com/koralabs/adahandle-deployments/master/common/main.sh -o main.sh
        chmod +x main.sh && ./main.sh